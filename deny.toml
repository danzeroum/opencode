# cargo-deny configuration — supply-chain gate (advisories / licenses / bans / sources).
[advisories]
version = 2
yanked = "deny"
# Vulnerabilities still fail the build (cargo-deny default); only scope the noisier
# "unmaintained" advisory to our own workspace deps, not deep transitive crates.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  # webpki-roots (Mozilla CA set bundled for the rustls TLS backend) is licensed under the
  # permissive Community Data License Agreement. (`ring` reports a clean `Apache-2.0 AND ISC`,
  # already covered above, so it needs no special entry.)
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
